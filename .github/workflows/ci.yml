name: CI

# Автозапуск выключен: Actions в организации хакатона не оплачены, и каждый PR получал бы красный крестик.
# Перед PR запускайте те же проверки локально: make check. Если Actions заработают, верните триггеры:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.10"
          working-directory: backend
      - run: bash scripts/check.sh lint test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check.sh smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check frontend without external services
        run: >-
          docker run --rm --network none
          -v "$GITHUB_WORKSPACE/frontend:/app:ro" -w /app node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
          sh -c 'npm run check && npm test && npm run test:integration'
