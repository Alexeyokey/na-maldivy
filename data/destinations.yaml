    license: MIT
    retrieved_at: '2026-10-25'
    period: null
    method: Pinned commit a89e4e0dda9d9878337e2da190ebe1ef1d6af705; SHA256 a7754cbe722ea21f0f9ab1ef07f4f07ee1e85b9cc99191ebde0b49fabb3c149a.
      Select 48 unique destination IATA records plus two origin anchors (MOW uses SVO, LED uses LED); rename lat/lon/tz
      to latitude/longitude/timezone. Airport values otherwise unchanged.
