    license: null
    retrieved_at: '2026-10-26'
    period: null
    method: Tags are editorial navigation labels, not a guarantee of hotel amenities. Domestic means destination
      country RU equals traveller citizenship RU; special documents and local access restrictions are not assessed.
  nasa-power-climatology:
    title: NASA POWER MERRA-2 monthly meteorological climatology
    url: https://power.larc.nasa.gov/docs/services/api/temporal/climatology/
    license: CC BY 4.0
    retrieved_at: '2026-10-25'
    period: 1991-2020
    method: T2M mean air temperature (°C), PRECTOTCORR mean daily precipitation (mm/day), requested with start=1991/end=2020
      and checked against every returned header.range. Monthly precipitation = rounded source daily mean × mean
      Gregorian month length across 1991–2020.
  noaa-oisst-climatology:
    title: NOAA OISST v2.1 0.25° monthly SST climatology
    url: https://downloads.psl.noaa.gov/Datasets/noaa.oisst.v2.highres/sst.mon.ltm.1991-2020.nc
    license: NOAA data may be used and redistributed for free; acknowledgement requested
    retrieved_at: '2026-10-25'
    period: 1991-2020
    method: Nearest valid 0.25° ocean grid cell within 100 km of a beach-tagged destination; all 12 months present
      and ≥27 valid years per month. Inland destinations and unavailable ocean cells have null water temperatures.
