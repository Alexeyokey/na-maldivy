services:
  agent:
    build: ./backend
    env_file:
      - path: .env
        required: false # без .env агент работает на фейковой модели
    ports:
      - "${AGENT_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro # справочники и базы инструментов, например data/transfers
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      AGENT_URL: http://agent:8000
      CHAT_MODE: api
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
