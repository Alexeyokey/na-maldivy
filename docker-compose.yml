services:
  agent:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile.demo
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      TOOLS_MODE: ${TOOLS_MODE:-real}
      FLIGHTS_MODE: ${FLIGHTS_MODE:-demo}
      TRAINS_MODE: ${TRAINS_MODE:-synthetic}
      CACHE_MODE: ${CACHE_MODE:-replay}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      AVIASALES_CACHE_DIR: ${AVIASALES_CACHE_DIR:-/data/demo/aviasales}
      YANDEX_CACHE_DIR: ${YANDEX_CACHE_DIR:-/state/yandex}
      CHECKOUT_DB_PATH: /state/checkout.sqlite3
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    volumes:
      - agent-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  app:
    platform: linux/amd64
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      AGENT_URL: http://agent:8000
      CHAT_MODE: api
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:8080/health'); if(!r.ok)process.exit(1)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

volumes:
  agent-state:
