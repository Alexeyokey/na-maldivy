services:
  agent:
    build: ./backend
    env_file:
      - path: .env
        required: false # без .env агент работает на фейковой модели
    environment:
      DATA_DIR: /data
      AVIASALES_CACHE_DIR: /state/aviasales
      YANDEX_CACHE_DIR: /state/yandex
      CHECKOUT_DB_PATH: /state/checkout.sqlite3
    ports:
      - "${AGENT_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro # справочники и базы инструментов, например data/transfers
      - agent-state:/state # приватные заказы и записываемый runtime-кэш
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      AGENT_URL: http://agent:8000
      CHAT_MODE: api
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-state:
