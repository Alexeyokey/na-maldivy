services:
  agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false # без .env агент работает на фейковой модели
    environment:
      CACHE_MODE: ${CACHE_MODE:-replay}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    ports:
      - "${AGENT_PORT:-8000}:8000"
    restart: unless-stopped

  # web: интерфейс появится в U1 (#6)
