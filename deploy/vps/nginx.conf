# Session/order capabilities occur in paths. Never write request paths to logs.
limit_req_zone $binary_remote_addr zone=demo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=demo_chat:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=demo_connections:10m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 120s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn demo_connections 8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_hide_header Cache-Control;

    location = /api/chat {
        limit_req zone=demo_api burst=80 nodelay;
        limit_req zone=demo_chat burst=20 nodelay;
        proxy_pass http://web:5173;
    }

    location /api/ {
        limit_req zone=demo_api burst=80 nodelay;
        proxy_pass http://web:5173;
    }

    location / {
        proxy_pass http://web:5173;
    }
}
