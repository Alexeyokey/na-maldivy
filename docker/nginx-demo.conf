# A localhost API entry point. The agent remains on the internal-only network.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Session capabilities and chat contents do not belong in access logs.
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 64k;

    location / {
        proxy_pass http://agent:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass SSE events immediately and keep the stream open for a full demo.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
    }
}
