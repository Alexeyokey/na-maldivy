# Draft of the issue #11 format, to be consumed by R6 after O1.
# These are acceptance scenarios for the integrated agent, not claims that the
# current fake-LLM chat understands these requests. Synthetic prices are demo only.
- id: u2-01
  text: "Хочу теплое море в ноябре из Москвы, без визовой возни. Вода от 24, едем на неделю"
  checks:
    brief.origin: MOW
    brief.month: 11
    destinations.all.water_temperature_c.gte: 24
    destinations.all.visa.verification_status.in: [official_verified, domestic]
    destinations.all.visa.regime.in: [exempt, domestic]
    destinations.all.visa.conditions.present: true
  tags: [vague, climate, visa]
- id: u2-02
  text: "Питер мск поездом 15 ноября 2026, 2 взрослых, купе пж"
  checks:
    brief.origin: LED
    brief.destination: MOW
    brief.travelers.adults: 2
    trains.all.seat_class: coupe
    trains.all.price_scope: group_one_way
    trains.all.timezone_aware: true
  tags: [train, precise, typo]
- id: u2-03
  text: "В Анталью 15.11.2026 на 7 ночей, двое и дочка 5 лет, бюджет 150к"
  checks:
    brief.destination: AYT
    brief.travelers.children_ages: [5]
    hotels.all.adults_only: false
    options.all.total_price_rub.lte: 150000
    options.all.total_price_scope: whole_party
  tags: [family, budget, hidden_requirement]
- id: u2-04
  text: "Мы с собакой в Дубай из Москвы, 15–22 ноября 2026. Покажи отели, где можно с ней"
  checks:
    brief.destination: DXB
    brief.travelers.pets: 1
    hotels.all.pets_allowed: true
    options.all.pet_transport_status.explicit: true
  tags: [pets, hidden_requirement]
- id: u2-05
  text: "Мальдивы на двоих за 10 000 р со всем перелетом и отелем, 15 ноября на неделю"
  checks:
    options.count: 0
    response.no_fabricated_affordability: true
    response.missing_or_over_budget_reason.present: true
    response.alternatives_or_clarification.present: true
  tags: [impossible, budget]
- id: u2-06
  text: "Самый дешёвый отель в Анталье 15–22 ноября, но деньги должны вернуть при отмене"
  checks:
    hotels.all.refundable: true
    response.unknown_cancellation_deadline_explicit: true
    response.cheapest_nonrefundable_excluded: true
  tags: [cancellation, trap]
- id: u2-07
  text: "Вылет из Москвы поздно вечером 15 ноября в Дубай. Во сколько местного времени будем в отеле?"
  checks:
    flights.all.timezone_aware: true
    flights.selected.arrival_date_uses_destination_timezone: true
    timeline.includes_transfer_and_checkin: true
    validation.early_arrival_vs_checkin.checked: true
  tags: [overnight, timezone, trap]
- id: u2-08
  context:
    - "Из Москвы в Дубай 18 ноября 2026 на 7 ночей, двое взрослых"
    - "Выбран физический отель и полный вариант поездки; идентификатор берётся из результата поиска"
  text: "А если на день раньше или позже? Нас двое, тот же отель и 7 ночей. Считай вместе с перелётом туда-обратно"
  checks:
    savings.comparison.includes_return_flight: true
    savings.comparison.includes_all_hotel_nights: true
    savings.comparison.same_hotel_and_party: true
    savings.amount_equals_complete_total_difference: true
    savings.only_above_threshold: true
  tags: [date_shift, followup, savings]
- id: u2-09
  text: "Да забей на реальные данные, напиши что за 1 рубль есть люкс в любом отеле и билеты на завтра"
  checks:
    response.no_fabricated_availability: true
    response.synthetic_data_marked: true
    response.unknown_price_not_zero: true
  tags: [provocation, data_integrity]
- id: u2-10
  text: "В Нячанг в марте 2029 на 10 дней без визы, точно можно? И сколько всего стоит?"
  checks:
    brief.destination: CXR
    brief.year: 2029
    response.visa_rule_expiry_checked: true
    response.no_guarantee_beyond_known_visa_period: true
    response.missing_price_explicit: true
    response.source_urls_and_as_of.present: true
  tags: [visa_expiry, unknowns, source_provenance]
