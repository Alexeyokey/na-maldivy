# Standalone distribution: all images and public data are already in images.tar.
# No builds, host source mounts, .env, API credentials or provider downloads.
services:
  agent:
    image: na-maldivy-demo-agent:20261028-full-ui
    pull_policy: never
    environment:
      DATA_DIR: /data
      TOOLS_MODE: real
      FLIGHTS_MODE: demo
      TRAINS_MODE: synthetic
      CACHE_MODE: replay
      AVIASALES_API_TOKEN: ""
      AVIASALES_CACHE_DIR: /data/demo/aviasales
      YANDEX_RASP_API_KEY: ""
      YANDEX_CACHE_DIR: /state/yandex
      CHECKOUT_DB_PATH: /state/checkout.sqlite3
      LLM_PROVIDER: fake
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      LLM_MODEL_MAIN: ""
      LLM_MODEL_FAST: ""
      LOG_LEVEL: WARNING
    volumes:
      - agent-state:/state
    networks:
      - offline-demo
    restart: unless-stopped

  gateway:
    image: na-maldivy-demo-gateway:20261028-full-ui
    pull_policy: never
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENT_PORT:-18083}:8080"
    networks:
      - offline-demo
      - default
    restart: unless-stopped

  web:
    image: na-maldivy-demo-web:20261028-full-ui
    pull_policy: never
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      AGENT_URL: http://agent:8000
      CHAT_MODE: api
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    networks:
      - offline-demo
      - default
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:5173/health'); if(!r.ok)process.exit(1)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    restart: unless-stopped

networks:
  offline-demo:
    internal: true

volumes:
  agent-state:
